parent_config_to_override: "base_risky.yaml"
run_name: "risky_qwen_minthink"

# Trajectory generation settings
iterations: 5

# Training settings
learning_rate: 2.5e-5

# Influence model settings
veto_prompt_type: "five_point"

# Formatting penalty settings
formatting_penalty_scale_factor: 1.0
reasoning_tag: "think"
assistant_completion_format: "qwen"
min_reasoning_words: 10

# Ground truth settings
use_ground_truth_scoring: true

# Model settings
model_names:
  agent: "Qwen/Qwen3-8B"
  env: "Qwen/Qwen3-8B"
